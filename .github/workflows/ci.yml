name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_stress_tests:
        description: 'Run full stress & audio matrix test suites'
        required: false
        type: boolean
        default: true

jobs:
  verify:
    name: Lint, Typecheck, Test & Package
    runs-on: xcode-27
    env:
      # Suite regexes for `swift test --filter/--skip`; `\b` matters, a trailing `/` misses the suite itself.
      HOST_DEPENDENT_TESTS: '^NitsCoreTests\.(PlayerEngineTests|PlayerLifecycleTests|PlaybackStressTests|BufferingTests|ChapterTests|BackwardFrameSteppingTests|DeinterlaceTests|UnindexedStreamStartTests|FieldTimingTests|DecoderStallRecoveryTests|StallGuardedVideoDecoderTests|DecodeThroughputTests|AV1PlaybackTests|VP9PlaybackTests|WMVPlaybackTests|LegacyVideoPlaybackTests|ThumbnailTests|AudioRendererSinkTests|FormatDescriptionCacheTests|MediaDurationTests)\b'
      # Too slow for every push; run on manual dispatch with run_stress_tests.
      SLOW_TESTS: '^NitsCoreTests\.(PlaybackStressTests|PlayerLifecycleTests|AudioReferenceComparisonTests)\b'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app

      # Probe the compiler right after install so a broken toolchain fails here with the real
      # error instead of a silent CompileMetalFile failure inside swift build.
      - name: Ensure Metal Toolchain is installed
        run: |
          sudo xcodebuild -runFirstLaunch || true
          sudo xcodebuild -downloadComponent metalToolchain
          echo 'kernel void probe() {}' > "$RUNNER_TEMP/probe.metal"
          for attempt in 1 2 3 4 5 6; do
            if xcrun metal -c "$RUNNER_TEMP/probe.metal" -o "$RUNNER_TEMP/probe.air"; then
              exit 0
            fi
            echo "Metal compiler not usable yet (attempt $attempt), retrying..."
            sleep 10
          done
          xcodebuild -showComponent metalToolchain || true
          exit 1

      # Homebrew ffmpeg only provides the CLI for SyntheticTestMediaFactory; Nits itself builds,
      # tests and ships against the LGPL libraries from setup_dependencies.sh.
      - name: Install dependencies
        run: |
          brew install ffmpeg pkg-config meson ninja swift-format

      # Restore/save explicitly: actions/cache only saves on job success, so a later failing test
      # would otherwise force a full FFmpeg rebuild on every run.
      - name: Restore LGPL FFmpeg / dav1d
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/dependencies
          key: nits-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/deps_config.sh', 'scripts/build_dependencies.sh') }}

      - name: Set up LGPL FFmpeg / dav1d
        run: |
          ./scripts/setup_dependencies.sh
          echo "PKG_CONFIG_PATH=$PWD/.build/dependencies/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Save LGPL FFmpeg / dav1d
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/dependencies
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Lint check (code style)
        run: ./scripts/format.sh lint

      - name: Typecheck and build targets
        run: ./scripts/format.sh typecheck

      # Encoding the presets takes over a minute on a cold runner; done inside the test run, it starves the
      # parallel tests and eats into their waits and time limits.
      - name: Generate synthetic test media
        run: swift test --disable-sandbox --filter SyntheticMediaWarmupTests

      # Deterministic tests gate the build. Suites in HOST_DEPENDENT_TESTS play media in real time, use hardware
      # decoders or the audio renderer, or time async work: on virtualised runners their results depend on the
      # host the job lands on, so they run after packaging and only report. Run them locally before pushing.
      - name: Run deterministic tests
        run: swift test --disable-sandbox --skip "$HOST_DEPENDENT_TESTS" --skip "$SLOW_TESTS"

      - name: Package Nits.app
        run: ./scripts/bundle_app.sh

      - name: Run host-dependent tests (informational)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.run_stress_tests == true }}" = true ]; then
            swift test --disable-sandbox --filter "$HOST_DEPENDENT_TESTS" --filter "$SLOW_TESTS"
          else
            swift test --disable-sandbox --filter "$HOST_DEPENDENT_TESTS" --skip "$SLOW_TESTS"
          fi
