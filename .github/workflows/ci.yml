name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_stress_tests:
        description: 'Run full stress & audio matrix test suites'
        required: false
        type: boolean
        default: true

jobs:
  verify:
    name: Lint, Typecheck, Test & Package
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Install dependencies
        run: |
          brew install ffmpeg pkg-config swift-format

      - name: Ensure Metal Toolchain is installed
        run: |
          sudo xcodebuild -runFirstLaunch || true
          sudo xcodebuild -downloadComponent metalToolchain

      - name: Lint check (code style)
        run: ./scripts/format.sh lint

      - name: Typecheck and build targets
        run: ./scripts/format.sh typecheck

      - name: Run fast unit tests (Push / PR)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_stress_tests != true }}
        run: swift test --disable-sandbox --skip PlaybackStressTests --skip AudioReferenceComparisonTests --skip PlayerLifecycleTests

      - name: Run full test suite including stress tests (Manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_stress_tests == true }}
        run: swift test --disable-sandbox

      - name: Package Nits.app
        run: ./scripts/bundle_app.sh
